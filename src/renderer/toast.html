<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>FarSight</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        padding: 10px;
      }
      .card {
        height: 100%;
        border-radius: 24px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        background: rgba(36, 30, 54, 0.9);
        animation: drop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.15);
        overflow: hidden;
        position: relative;
      }
      @keyframes drop {
        from {
          transform: translateY(-12px) scale(0.98);
          opacity: 0;
        }
      }
      .head {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .head .text {
        flex: 1;
        min-width: 0;
      }
      .title {
        font-family: var(--font);
        font-weight: 700;
        font-size: 17px;
      }
      .title.num {
        font-size: 24px;
        line-height: 1.1;
      }
      .sub {
        color: var(--fg-2);
        font-size: 14px;
        margin-top: 3px;
        line-height: 1.3;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .actions button {
        padding: 8px 15px;
        font-size: 14.5px;
      }
      .x {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 24px;
        height: 24px;
        padding: 3px;
        color: var(--fg-3);
        display: none;
      }
      .card:hover .x {
        display: block;
      }
      .x svg {
        width: 100%;
        height: 100%;
      }

      /* compact pill: wellness reminders and notices */
      body.pill {
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }
      body.pill .card {
        height: auto;
        width: auto;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        padding: 9px 20px 9px 9px;
        border-radius: 22px;
      }
      body.pill .title {
        font-size: 16px;
      }
      body.notice .card {
        background: rgba(255, 220, 196, 0.86);
        border-color: rgba(255, 255, 255, 0.6);
        color: #2a1a12;
      }
    </style>
  </head>
  <body>
    <div class="card glass" id="card"></div>
    <script src="toast.js"></script>
  </body>
</html>
